<!DOCTYPE html><html><body><canvas id="c192" width="192" height="192"></canvas><canvas id="c512" width="512" height="512"></canvas><script>
function draw(id,size){var c=document.getElementById(id),ctx=c.getContext("2d");ctx.fillStyle="#FF6B00";ctx.beginPath();ctx.roundRect(0,0,size,size,size*0.2);ctx.fill();ctx.fillStyle="#fff";ctx.font="bold "+size*0.5+"px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("R",size/2,size/2);}
draw("c192",192);draw("c512",512);
document.body.innerHTML+="<br><a download=icon-192.png href="+document.getElementById("c192").toDataURL()+" >Download 192</a> <a download=icon-512.png href="+document.getElementById("c512").toDataURL()+" >Download 512</a>";
</script></body></html>
