openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Restaurant Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: categories
    description: Menu category operations
  - name: dishes
    description: Dish operations
  - name: tables
    description: Table operations
  - name: orders
    description: Order operations
  - name: ratings
    description: Rating operations
  - name: stats
    description: Statistics and dashboard
  - name: users
    description: User management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── AUTH ──────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ── CATEGORIES ────────────────────────────────────────────────────────────
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      parameters:
        - name: includeInactive
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    get:
      operationId: getCategory
      tags: [categories]
      summary: Get category by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a category (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /categories/reorder:
    patch:
      operationId: reorderCategories
      tags: [categories]
      summary: Reorder categories (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderInput"
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ── DISHES ────────────────────────────────────────────────────────────────
  /dishes:
    get:
      operationId: listDishes
      tags: [dishes]
      summary: List dishes
      parameters:
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: available
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of dishes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dish"
    post:
      operationId: createDish
      tags: [dishes]
      summary: Create a dish (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DishInput"
      responses:
        "201":
          description: Dish created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dish"

  /dishes/{id}:
    get:
      operationId: getDish
      tags: [dishes]
      summary: Get dish by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dish
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dish"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateDish
      tags: [dishes]
      summary: Update a dish (admin/vendor)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DishUpdate"
      responses:
        "200":
          description: Updated dish
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dish"
    delete:
      operationId: deleteDish
      tags: [dishes]
      summary: Delete a dish (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /dishes/{id}/toggle-availability:
    patch:
      operationId: toggleDishAvailability
      tags: [dishes]
      summary: Toggle dish availability (vendor/admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated dish
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dish"

  # ── TABLES ────────────────────────────────────────────────────────────────
  /tables:
    get:
      operationId: listTables
      tags: [tables]
      summary: List all tables
      responses:
        "200":
          description: List of tables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Table"
    post:
      operationId: createTable
      tags: [tables]
      summary: Create a table (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableInput"
      responses:
        "201":
          description: Table created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"

  /tables/{id}:
    get:
      operationId: getTable
      tags: [tables]
      summary: Get table by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateTable
      tags: [tables]
      summary: Update a table (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableUpdate"
      responses:
        "200":
          description: Updated table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
    delete:
      operationId: deleteTable
      tags: [tables]
      summary: Delete a table (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /tables/by-token/{token}:
    get:
      operationId: getTableByToken
      tags: [tables]
      summary: Get table by QR token (public, client use)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── ORDERS ────────────────────────────────────────────────────────────────
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, refused, ready, delivered]
        - name: tableId
          in: query
          schema:
            type: integer
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderWithItems"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order (client)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderWithItems"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderWithItems"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status (vendor/admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderWithItems"

  /orders/table/{tableId}/active:
    get:
      operationId: getActiveOrderByTable
      tags: [orders]
      summary: Get active order for a table (client polling)
      parameters:
        - name: tableId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Active order or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderWithItems"
        "404":
          description: No active order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── RATINGS ───────────────────────────────────────────────────────────────
  /ratings:
    get:
      operationId: listRatings
      tags: [ratings]
      summary: List ratings (admin/vendor)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of ratings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rating"
    post:
      operationId: createRating
      tags: [ratings]
      summary: Submit a rating for an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingInput"
      responses:
        "201":
          description: Rating created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rating"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── STATS / DASHBOARD ─────────────────────────────────────────────────────
  /stats/dashboard:
    get:
      operationId: getDashboardStats
      tags: [stats]
      summary: Get dashboard summary stats (vendor/admin)
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /stats/revenue:
    get:
      operationId: getRevenueStats
      tags: [stats]
      summary: Get revenue over time (admin)
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
            enum: [day, week, month, year]
      responses:
        "200":
          description: Revenue data points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RevenuePoint"

  /stats/popular-dishes:
    get:
      operationId: getPopularDishes
      tags: [stats]
      summary: Get most popular dishes (admin)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Popular dishes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PopularDish"

  /stats/orders-by-status:
    get:
      operationId: getOrdersByStatus
      tags: [stats]
      summary: Get order count grouped by status (vendor/admin)
      responses:
        "200":
          description: Orders grouped by status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderStatusCount"

  /stats/peak-hours:
    get:
      operationId: getPeakHours
      tags: [stats]
      summary: Get peak order hours (admin)
      responses:
        "200":
          description: Peak hour data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PeakHour"

  # ── USERS (admin) ─────────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users (admin)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

components:
  schemas:
    # ── COMMON ──────────────────────────────────────────────────────────────
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    ReorderInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, orderIndex]
            properties:
              id:
                type: integer
              orderIndex:
                type: integer

    # ── AUTH ────────────────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RegisterInput:
      type: object
      required: [email, password, name, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        name:
          type: string
        role:
          type: string
          enum: [client, vendor, admin]
        langPref:
          type: string
          enum: [ar, fr, en]

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, email, name, role, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [client, vendor, admin]
        langPref:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    UserInput:
      type: object
      required: [email, password, name, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        name:
          type: string
        role:
          type: string
          enum: [client, vendor, admin]
        langPref:
          type: string

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [client, vendor, admin]
        langPref:
          type: string
        password:
          type: string

    # ── CATEGORIES ──────────────────────────────────────────────────────────
    Category:
      type: object
      required: [id, nameAr, nameFr, nameEn, orderIndex, isActive]
      properties:
        id:
          type: integer
        nameAr:
          type: string
        nameFr:
          type: string
        nameEn:
          type: string
        icon:
          type: ["string", "null"]
        orderIndex:
          type: integer
        isActive:
          type: boolean

    CategoryInput:
      type: object
      required: [nameAr, nameFr, nameEn]
      properties:
        nameAr:
          type: string
        nameFr:
          type: string
        nameEn:
          type: string
        icon:
          type: string
        orderIndex:
          type: integer

    CategoryUpdate:
      type: object
      properties:
        nameAr:
          type: string
        nameFr:
          type: string
        nameEn:
          type: string
        icon:
          type: string
        orderIndex:
          type: integer
        isActive:
          type: boolean

    # ── DISHES ──────────────────────────────────────────────────────────────
    Dish:
      type: object
      required: [id, categoryId, nameAr, nameFr, nameEn, price, isAvailable, isPopular, isNew]
      properties:
        id:
          type: integer
        categoryId:
          type: integer
        nameAr:
          type: string
        nameFr:
          type: string
        nameEn:
          type: string
        descriptionAr:
          type: ["string", "null"]
        descriptionFr:
          type: ["string", "null"]
        descriptionEn:
          type: ["string", "null"]
        price:
          type: number
        imageUrl:
          type: ["string", "null"]
        allergens:
          type: array
          items:
            type: string
        isPopular:
          type: boolean
        isNew:
          type: boolean
        isAvailable:
          type: boolean

    DishInput:
      type: object
      required: [categoryId, nameAr, nameFr, nameEn, price]
      properties:
        categoryId:
          type: integer
        nameAr:
          type: string
        nameFr:
          type: string
        nameEn:
          type: string
        descriptionAr:
          type: string
        descriptionFr:
          type: string
        descriptionEn:
          type: string
        price:
          type: number
        imageUrl:
          type: string
        allergens:
          type: array
          items:
            type: string
        isPopular:
          type: boolean
        isNew:
          type: boolean

    DishUpdate:
      type: object
      properties:
        categoryId:
          type: integer
        nameAr:
          type: string
        nameFr:
          type: string
        nameEn:
          type: string
        descriptionAr:
          type: string
        descriptionFr:
          type: string
        descriptionEn:
          type: string
        price:
          type: number
        imageUrl:
          type: string
        allergens:
          type: array
          items:
            type: string
        isPopular:
          type: boolean
        isNew:
          type: boolean
        isAvailable:
          type: boolean

    # ── TABLES ──────────────────────────────────────────────────────────────
    Table:
      type: object
      required: [id, number, qrToken, isActive]
      properties:
        id:
          type: integer
        number:
          type: integer
        qrToken:
          type: string
        isActive:
          type: boolean
        status:
          type: string
          enum: [free, occupied, waiting]

    TableInput:
      type: object
      required: [number]
      properties:
        number:
          type: integer

    TableUpdate:
      type: object
      properties:
        number:
          type: integer
        isActive:
          type: boolean

    # ── ORDERS ──────────────────────────────────────────────────────────────
    OrderItem:
      type: object
      required: [id, dishId, quantity, unitPrice]
      properties:
        id:
          type: integer
        dishId:
          type: integer
        dish:
          $ref: "#/components/schemas/Dish"
        quantity:
          type: integer
        unitPrice:
          type: number
        customNote:
          type: ["string", "null"]

    OrderWithItems:
      type: object
      required: [id, tableId, status, totalPrice, createdAt, updatedAt, items]
      properties:
        id:
          type: integer
        tableId:
          type: integer
        table:
          $ref: "#/components/schemas/Table"
        status:
          type: string
          enum: [pending, confirmed, refused, ready, delivered]
        totalPrice:
          type: number
        note:
          type: ["string", "null"]
        refusalReason:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        rating:
          $ref: "#/components/schemas/Rating"

    OrderInput:
      type: object
      required: [tableId, items]
      properties:
        tableId:
          type: integer
        note:
          type: string
        items:
          type: array
          items:
            type: object
            required: [dishId, quantity]
            properties:
              dishId:
                type: integer
              quantity:
                type: integer
              customNote:
                type: string

    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [confirmed, refused, ready, delivered]
        refusalReason:
          type: string

    # ── RATINGS ─────────────────────────────────────────────────────────────
    Rating:
      type: object
      required: [id, orderId, stars, createdAt]
      properties:
        id:
          type: integer
        orderId:
          type: integer
        stars:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    RatingInput:
      type: object
      required: [orderId, stars]
      properties:
        orderId:
          type: integer
        stars:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string

    # ── STATS ────────────────────────────────────────────────────────────────
    DashboardStats:
      type: object
      required: [todayRevenue, todayOrders, pendingOrders, avgRating, totalDishes, activeTables]
      properties:
        todayRevenue:
          type: number
        todayOrders:
          type: integer
        pendingOrders:
          type: integer
        avgRating:
          type: number
        totalDishes:
          type: integer
        activeTables:
          type: integer

    RevenuePoint:
      type: object
      required: [label, revenue, orders]
      properties:
        label:
          type: string
        revenue:
          type: number
        orders:
          type: integer

    PopularDish:
      type: object
      required: [dishId, nameEn, nameFr, nameAr, totalOrdered]
      properties:
        dishId:
          type: integer
        nameEn:
          type: string
        nameFr:
          type: string
        nameAr:
          type: string
        totalOrdered:
          type: integer
        imageUrl:
          type: ["string", "null"]

    OrderStatusCount:
      type: object
      required: [status, count]
      properties:
        status:
          type: string
        count:
          type: integer

    PeakHour:
      type: object
      required: [hour, count]
      properties:
        hour:
          type: integer
        count:
          type: integer
